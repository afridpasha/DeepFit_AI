<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>DeepFit - Vertical Jump Tracker</title>
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" type="image/x-icon">
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
        }

        #video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #video-feed {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            object-fit: contain;
            background: #000;
        }

        .video-placeholder {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: radial-gradient(circle at center, rgba(35, 35, 35, 0.45), rgba(0, 0, 0, 0.85));
            pointer-events: none;
        }

        .placeholder-content {
            padding: 20px;
            max-width: 560px;
        }

        .placeholder-content h2 {
            font-size: clamp(20px, 3vw, 34px);
            margin-bottom: 10px;
        }

        .placeholder-content p {
            font-size: clamp(14px, 1.5vw, 18px);
            color: #d0d0d0;
            line-height: 1.5;
        }

        #back-btn {
            position: fixed;
            top: max(10px, env(safe-area-inset-top));
            left: max(10px, env(safe-area-inset-left));
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.35);
            background: rgba(0, 0, 0, 0.72);
            color: #fff;
            text-decoration: none;
            font-size: 22px;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1100;
            backdrop-filter: blur(8px);
            transition: background 0.2s ease;
        }

        #back-btn:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        #stats-panel {
            position: fixed;
            top: max(12px, env(safe-area-inset-top));
            right: max(12px, env(safe-area-inset-right));
            z-index: 1100;
            width: min(350px, calc(100vw - 24px));
            background: rgba(0, 0, 0, 0.74);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 14px;
            backdrop-filter: blur(10px);
            padding: 14px 14px 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
            max-height: min(80vh, 620px);
            overflow-y: auto;
        }

        #stats-panel h3 {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            padding: 8px 0;
            border-top: 1px solid rgba(255, 255, 255, 0.12);
        }

        .stat-item:first-of-type {
            border-top: none;
            padding-top: 0;
        }

        .stat-label {
            font-size: 13px;
            color: #d1d5db;
            flex: 1;
        }

        .stat-value,
        .feedback,
        .status-text {
            font-size: 15px;
            font-weight: 700;
            color: #fff;
            text-align: right;
            flex: 1;
        }

        #controls-panel {
            position: fixed;
            bottom: max(14px, env(safe-area-inset-bottom));
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 1100;
            background: rgba(0, 0, 0, 0.8);
            padding: 12px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }

        .control-btn {
            padding: 10px 18px;
            font-size: 14px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #fff;
            min-width: 135px;
        }

        .control-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 255, 255, 0.26);
        }

        .control-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #start-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        #stop-btn {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
        }

        #save-btn {
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
        }

        #reset-btn {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .status-success {
            color: #22c55e;
        }

        .status-warning {
            color: #f59e0b;
        }

        @media (max-width: 900px) {
            #stats-panel {
                width: min(270px, 62vw);
                top: max(8px, env(safe-area-inset-top));
                right: max(8px, env(safe-area-inset-right));
                padding: 8px 9px;
                max-height: 44vh;
            }

            #stats-panel h3 {
                font-size: 15px;
                margin-bottom: 6px;
            }

            .stat-item {
                padding: 5px 0;
                gap: 8px;
            }

            .stat-label {
                font-size: 11px;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .stat-value,
            .feedback,
            .status-text {
                font-size: 12px;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            #controls-panel {
                width: calc(100vw - 14px);
                display: grid;
                grid-template-columns: repeat(4, minmax(0, 1fr));
                gap: 6px;
                padding: 7px;
                bottom: max(8px, env(safe-area-inset-bottom));
            }

            .control-btn {
                min-width: 0;
                width: 100%;
                padding: 8px 6px;
                font-size: 11px;
            }

            #back-btn {
                width: 38px;
                height: 38px;
                font-size: 20px;
            }
        }

        @media (max-width: 520px) {
            #stats-panel {
                width: min(236px, 58vw);
                padding: 7px 8px;
                max-height: 40vh;
            }

            #stats-panel h3 {
                font-size: 14px;
            }

            .stat-item {
                padding: 4px 0;
            }

            .stat-label {
                font-size: 10px;
            }

            .stat-value,
            .feedback,
            .status-text {
                font-size: 11px;
            }
        }

    </style>
</head>
<body>
    <div id="video-container">
        <img id="video-feed" alt="Camera feed" style="display: none;">
        <div id="placeholder" class="video-placeholder">
            <div class="placeholder-content">
                <h2>Vertical Jump Tracker</h2>
                <p>Stand far enough so your full body is visible, then click Start Camera.</p>
            </div>
        </div>
    </div>

    <a id="back-btn" href="/dashboard" aria-label="Go back" title="Back">&larr;</a>

    <div id="stats-panel">
        <h3>Jump Stats</h3>
        <div class="stat-item">
            <div class="stat-label">Total Jumps</div>
            <div class="stat-value" id="jump-count">0</div>
        </div>
        <div class="stat-item">
            <div class="stat-label">Current Height</div>
            <div class="stat-value" id="current-height">0.0 cm</div>
        </div>
        <div class="stat-item">
            <div class="stat-label">Max Height</div>
            <div class="stat-value" id="max-height">0.0 cm</div>
        </div>
        <div class="stat-item">
            <div class="stat-label">Jump State</div>
            <div class="status-text" id="jump-state">GROUND</div>
        </div>
        <div class="stat-item">
            <div class="stat-label">Feedback</div>
            <div class="status-text" id="feedback">System Ready</div>
        </div>
        <div class="stat-item">
            <div class="stat-label">Calibration</div>
            <div class="status-text status-warning" id="calibration-status">Not Calibrated</div>
        </div>
        <div class="stat-item">
            <div class="stat-label">Timer</div>
            <div class="stat-value" id="timer-display">3:00</div>
        </div>
        <div class="stat-item">
            <div class="stat-label">Session</div>
            <div class="status-text" id="session-status">Ready to start</div>
        </div>
    </div>

    <div id="controls-panel">
        <button id="start-btn" class="control-btn">Start Camera</button>
        <button id="save-btn" class="control-btn" disabled>Save</button>
        <button id="stop-btn" class="control-btn" disabled>Stop Camera</button>
        <button id="reset-btn" class="control-btn">Reset Counter</button>
    </div>

    <script>
        if (typeof io === 'undefined') {
            console.error('Socket.IO failed to load');
            alert('Connection error. Please refresh the page.');
        }
    </script>
    <script src="{{ url_for('static', filename='js/webcam-capture.js') }}?v=6"></script>
    <script src="{{ url_for('static', filename='vertical-jump-script.js') }}?v=6"></script>
</body>
</html>
